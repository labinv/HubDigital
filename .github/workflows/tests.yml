name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  application:
    name: Application (PHP 8.4)
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip
          tools: composer:v2
          coverage: none

      - name: Add Flux credentials loaded from environment
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear --ansi

      - name: Run PHPUnit and Pest tests
        run: php artisan test

  behat:
    runs-on: ubuntu-latest
    environment: Testing
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip
          tools: composer:v2
          coverage: none

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Clear Configuration Cache
        run: php artisan config:clear --ansi

      # Solo corren en CI las features marcadas con @listo (opt-in): features
      # terminadas y 100% verdes. Las features a medio implementar (pasos
      # pending/undefined o escenarios en rojo) quedan fuera del filtro y no
      # rompen el pipeline. Cuando una feature se completa se le agrega el tag
      # @listo encima de "Característica:" y entra automaticamente a CI.
      #
      # Como el set @listo es curado, se corre en --strict: una feature marcada
      # como lista DEBE estar totalmente verde (sin pending ni undefined).
      #
      # La suite es 100% volatil: todos los modulos usan repositorios InMemory en
      # Behat, por eso no se provisiona Postgres ni variables de conexion.
      - name: Run Behat
        run: vendor/bin/behat --profile=default --no-interaction --tags=@listo --strict
