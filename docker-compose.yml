services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    env_file: ./.env
    environment:
      DEPOSIT_STORAGE_DRIVER: ${DEPOSIT_STORAGE_DRIVER:-auto}
      DEPOSIT_STORAGE_REQUIRE_REMOTE: ${DEPOSIT_STORAGE_REQUIRE_REMOTE:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    volumes:
      - ./storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    expose:
      - "9000"
    networks:
      - internal

  worker:
    build:
      context: .
      target: production
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    env_file: ./.env
    environment:
      DEPOSIT_STORAGE_DRIVER: ${DEPOSIT_STORAGE_DRIVER:-auto}
      DEPOSIT_STORAGE_REQUIRE_REMOTE: ${DEPOSIT_STORAGE_REQUIRE_REMOTE:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: ./.env
    environment:
      DEPOSIT_STORAGE_DRIVER: ${DEPOSIT_STORAGE_DRIVER:-auto}
      DEPOSIT_STORAGE_REQUIRE_REMOTE: ${DEPOSIT_STORAGE_REQUIRE_REMOTE:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    command: php artisan schedule:work
    volumes:
      - ./storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  nginx:
    build:
      context: .
      target: nginx-stage
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./storage/app/public:/var/www/html/public/storage:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  mailpit:
    image: axllent/mailpit:latest
    profiles:
      - development
    restart: unless-stopped
    ports:
      - "8025:8025"
    expose:
      - "1025"
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      nginx:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

volumes:
  postgres_data:
  laravel_cache:

networks:
  internal:
    driver: bridge
