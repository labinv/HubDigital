[hubdigital]
user = www-data
group = www-data
listen = /run/php/hubdigital.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Dos solicitudes PHP como maximo: el tercer usuario espera en nginx en vez de
; desplazar PostgreSQL u OCR a OOM.
pm = dynamic
pm.max_children = 2
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 300
request_terminate_timeout = 240s
request_slowlog_timeout = 15s
slowlog = /var/log/php8.4-fpm/hubdigital-slow.log

clear_env = no
catch_workers_output = yes
php_admin_value[upload_tmp_dir] = /run/hubdigital/php-upload
php_admin_value[sys_temp_dir] = /run/hubdigital/php-tmp
php_admin_value[session.save_path] = /run/hubdigital/php-sessions
