; Perfil Oracle: limite por request; FPM limita ademas el numero de hijos.
memory_limit=192M
upload_max_filesize=50M
post_max_size=55M
max_execution_time=120
max_input_time=120
max_file_uploads=10
expose_php=Off
display_errors=Off
log_errors=On
error_log=/dev/stderr
upload_tmp_dir=/run/hubdigital/php-upload
sys_temp_dir=/run/hubdigital/php-tmp
session.save_path=/run/hubdigital/php-sessions

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
