# /run debe verificarse como tmpfs durante preflight. Las operaciones eliminan
# sus directorios en finally; este TTL de 20 minutos y su timer atienden sólo
# procesos terminados abruptamente, sin convertir /run en persistencia.
d /run/hubdigital 0710 www-data www-data -
d /run/hubdigital/document-processing 0700 www-data www-data 20m
d /run/hubdigital/livewire-tmp 0700 www-data www-data 20m
d /run/hubdigital/php-upload 0700 www-data www-data 20m
d /run/hubdigital/php-tmp 0700 www-data www-data 20m
d /run/hubdigital/php-sessions 0700 www-data www-data 20m
d /run/hubdigital/nginx-client 0700 www-data www-data 20m
d /run/hubdigital/nginx-fastcgi 0700 www-data www-data 20m
