# Perfil inicial para VM.Standard.E2.1.Micro (~954 MiB observados).
# PostgreSQL solo escucha loopback; 5432 no se publica por nginx ni Tunnel.
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 20
shared_buffers = '96MB'
effective_cache_size = '256MB'
work_mem = '2MB'
maintenance_work_mem = '64MB'
wal_buffers = '4MB'
max_wal_size = '1GB'
min_wal_size = '80MB'
checkpoint_completion_target = 0.9
random_page_cost = 1.1
log_min_duration_statement = -1
log_statement = 'none'
log_temp_files = 0
password_encryption = 'scram-sha-256'
